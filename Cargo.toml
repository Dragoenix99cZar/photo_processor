[package]
name = "photo-processor"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The core bridge between Rust and JavaScript
wasm-bindgen = "0.2"

# Lightweight image processing crate (configured for small WASM sizes)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Console panic hook logs Rust errors directly to your browser's dev tools console
console_error_panic_hook = "0.1.7"
